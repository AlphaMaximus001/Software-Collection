<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maaef Systems</title>
<style>
  :root{
    --bg:#141414; --bg2:#1f1f1f;
    --ink:#e5e5e5; --ink2:#8c8c8c;
    --seal:#b0263a; --canal:#2a8c82;
    --sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--bg);
    min-height:100vh;-webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  .brand{position:fixed;top:36px;left:40px;width:46px;height:auto;opacity:.94}

  main{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:120px 24px}

  .profiles{display:flex;gap:56px;flex-wrap:wrap;justify-content:center}
  .profile{display:flex;flex-direction:column;align-items:center;gap:18px;cursor:pointer}

  .avatar{width:150px;height:150px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:3px solid transparent;transition:border-color .15s ease,transform .15s ease}
  .avatar svg{width:64px;height:64px}
  .a-directory{background:var(--seal)}
  .a-pricing{background:var(--canal)}

  .profile:hover .avatar,.profile:focus-visible .avatar{border-color:#fff;transform:scale(1.04)}
  .profile:focus-visible{outline:none}

  .name{font-size:17px;color:var(--ink2);transition:color .15s ease}
  .profile:hover .name,.profile:focus-visible .name{color:#fff}

  @media (max-width:520px){
    .brand{top:24px;left:24px;width:38px}
    .profiles{gap:34px}
    .avatar{width:112px;height:112px}
    .avatar svg{width:48px;height:48px}
  }
</style>
</head>
<body>
  <img class="brand" src="assets/maaef-mark-white.png" alt="Maaef">

  <main>
    <div class="profiles">
      <a class="profile" href="https://maaef-dashboard-roan.vercel.app/" target="_blank" rel="noopener">
        <span class="avatar a-directory">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="3" width="4" height="4" rx="1"></rect>
            <rect x="3" y="17" width="4" height="4" rx="1"></rect>
            <rect x="17" y="17" width="4" height="4" rx="1"></rect>
            <path d="M12 7v4M12 11H5v6M12 11h7v6"></path>
          </svg>
        </span>
        <span class="name">Posting Directory</span>
      </a>

      <a class="profile" href="https://maaef-pricelisttool.onrender.com/" target="_blank" rel="noopener">
        <span class="avatar a-pricing">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 12.5 12.8 20.2a1.5 1.5 0 0 1-2.12 0l-6.88-6.88a1.5 1.5 0 0 1 0-2.12L11.5 3.5H19a1.5 1.5 0 0 1 1.5 1.5v7.5Z"></path>
            <circle cx="15.5" cy="8.5" r="1.5" fill="#fff" stroke="none"></circle>
          </svg>
        </span>
        <span class="name">Price List Tool</span>
      </a>
    </div>
  </main>
</body>
</html>
